			shellScript = "set -eu\n# The Rust core, as a static library, and the `margin` CLI, for each\n# architecture being built; then the Swift bindings to the library.\nexport PATH=\"$HOME/.cargo/bin:$PATH\"\nroot=\"$PROJECT_DIR/..\"\nout=\"$PROJECT_DIR/build/rust/$CONFIGURATION\"\nif [ \"$CONFIGURATION\" = Release ]; then flag=--release; dir=release; else flag=; dir=debug; fi\nlibs=\nclis=\nfor arch in $ARCHS; do\n    case $arch in arm64) target=aarch64-apple-darwin ;; *) target=x86_64-apple-darwin ;; esac\n    cargo build $flag --target \"$target\" -p margin-ffi --lib --manifest-path \"$root/Cargo.toml\"\n    cargo build $flag --target \"$target\" -p margin --bin margin --manifest-path \"$root/Cargo.toml\"\n    libs=\"$libs $root/target/$target/$dir/libmargin_ffi.a\"\n    clis=\"$clis $root/target/$target/$dir/margin\"\ndone\nmkdir -p \"$out\"\nlipo -create $libs -output \"$out/libmargin_ffi.a\"\nlipo -create $clis -output \"$out/margin\"\n# The bindings come from the library's metadata; any architecture will do.\n# The generator runs on this Mac only, and needn't be optimized.\ngen=\"$PROJECT_DIR/build/gen\"\nmkdir -p \"$gen\"\ncargo run -q -p margin-ffi --features cli --bin uniffi-bindgen --manifest-path \"$root/Cargo.toml\" -- \\\n    generate --library \"$root/target/$target/$dir/libmargin_ffi.dylib\" --language swift --out-dir \"$gen\"\n";
