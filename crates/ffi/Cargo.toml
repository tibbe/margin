[package]
name = "margin-ffi"
description = "Margin's core for the native macOS editor, through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "margin_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# The Swift bindings' generator, which only the build runs. Off in the
# library, which it would otherwise make much slower to compile.
cli = ["uniffi/cli"]

[lints]
workspace = true

[dependencies]
margin-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
uniffi = "0.32"
