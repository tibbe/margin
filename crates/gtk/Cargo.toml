[package]
name = "margin-gtk"
description = "Margin's editor for Linux (Omarchy), with GTK 4 and libadwaita"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
margin-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
similar.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Empty on macOS, whose editor is the native app in `macos/`, so the
# workspace builds and tests there too.
[target.'cfg(not(target_os = "macos"))'.dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
pangocairo = "0.22"
