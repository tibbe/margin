[package]
name = "margin"
version = "0.1.0"
edition = "2024"
description = "A native Markdown editor with Google Docs-style comments that coding agents read through a CLI"
license = "MIT"
repository = "https://github.com/tibbe/margin"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
pulldown-cmark = { version = "0.13", default-features = false }
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.10"
unicode-segmentation = "1.13.3"
pangocairo = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
