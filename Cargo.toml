[workspace]
resolver = "3"
members = ["crates/core", "crates/gtk", "crates/cli", "crates/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tibbe/margin"

[workspace.dependencies]
margin-core = { path = "crates/core" }
margin-gtk = { path = "crates/gtk" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
similar = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
