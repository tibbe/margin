[workspace]
resolver = "3"
members = ["crates/core", "crates/gtk", "crates/cli", "crates/ffi", "crates/uniffi-bindgen"]
# Without the bindings generator, which only the macOS build runs: its
# `uniffi/cli` would change the features shared crates are built with, so
# builds with it and without it would each compile them.
default-members = ["crates/core", "crates/gtk", "crates/cli", "crates/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tibbe/margin"

[workspace.dependencies]
margin-core = { path = "crates/core" }
margin-gtk = { path = "crates/gtk" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
similar = "3"
uniffi = "0.32"

# Hand-picked rather than whole groups such as `clippy::pedantic`. Every
# crate inherits these with `[lints] workspace = true`. They warn, so
# work in progress still builds; the checks deny warnings.
[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
